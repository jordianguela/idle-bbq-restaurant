<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Idle BBQ Restaurant</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>🔥 Idle BBQ</h1>
    <p class="money">Diners: <span id="money">0</span> €</p>
  </header>
  <div id="notice" class="notice hidden"></div>
  <div class="shop">
    <button id="buy-table" class="shop-btn" data-action="buy-table"></button>
    <button id="buy-bbq" class="shop-btn" data-action="buy-bbq"></button>
  </div>
  <main class="floor">
    <section class="hall">
      <h2>Sala</h2>
      <div id="tables" class="tables"></div>
    </section>
    <section class="kitchen">
      <h2>Cuina</h2>
      <div id="order" class="order">Res per cuinar</div>
      <div id="bbqs" class="bbqs"></div>
      <div id="plates" class="plates"></div>
    </section>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
