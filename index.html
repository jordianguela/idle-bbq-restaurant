<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Idle BBQ — Nivell 1</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage">
    <canvas id="scene" aria-label="El restaurant: clients a la cua, graelles i pica"></canvas>

    <div class="hud">
      <p class="money"><span id="money">0</span> €</p>
      <div class="goal">
        <div class="bar"><span id="goal-fill"></span></div>
        <p class="goal-label"><span id="goal-cur">0</span> / <span id="goal-max">0</span> € per al nivell 2</p>
      </div>
    </div>

    <button id="build" class="build" title="Construir i millorar" aria-label="Construir i millorar">🔨</button>
    <div id="shop" class="shop hidden"></div>

    <div id="banner" class="banner hidden"></div>
    <p class="credits">Local: Bitglow · Cuina: 0-mem0ry · Personatges: Jephed</p>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
