<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Idle BBQ — Nivell 1</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>🍔 Nivell 1 · Street Food</h1>
    <p class="money">Diners: <span id="money">0</span> €</p>
  </header>
  <div class="goalbar">
    <div class="goal-label">Objectiu nivell 2: <span id="goal-cur">0</span> / <span id="goal-max">0</span> €</div>
    <div class="bar big"><span id="goal-fill"></span></div>
  </div>
  <div id="banner" class="banner hidden"></div>
  <div id="notice" class="notice hidden"></div>
  <div class="shop">
    <button id="buy-bbq" class="shop-btn" data-action="buy-bbq"></button>
  </div>
  <main class="floor">
    <section class="stage">
      <canvas id="scene" aria-label="El restaurant: clients a la cua i cuina amb les BBQ"></canvas>
    </section>
    <section class="kitchen">
      <h2>Cuina</h2>
      <div id="order" class="order">Res per cuinar</div>
      <div id="bbqs" class="bbqs"></div>
      <div id="plates" class="plates"></div>
    </section>
  </main>
  <footer class="credits">
    Sprites del local: Bitglow · Personatges: Jephed — Game Between The Lines
  </footer>
  <script type="module" src="src/main.js"></script>
</body>
</html>
